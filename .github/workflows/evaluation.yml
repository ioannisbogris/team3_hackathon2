name: Tests and automated evaluation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deterministic-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Run integrated guardrail and evaluation checks
        run: >-
          uv run python -m pytest -q
          tests/test_deep_agent_guardrails.py
          tests/test_integrated_evaluation.py
