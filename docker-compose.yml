# Full stack: pgvector + Langfuse + knowledge ingest + API.
#   cp .env.example .env   # fill in the Azure OpenAI values
#   docker compose up -d --build
# API: http://localhost:8000/docs   Langfuse: http://localhost:3000

include:
  - docker-compose-langfuse.yml

services:
  pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: langchain
      POSTGRES_PASSWORD: langchain
      POSTGRES_DB: vectorstore
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langchain -d vectorstore"]
      interval: 3s
      timeout: 3s
      retries: 10

  # One-off job: embeds knowledge/*.pdf into pgvector. Chunk ids are stable, so re-runs upsert instead of duplicating.
  ingest:
    build: .
    image: team3-hackathon2
    env_file: .env
    environment: &app-env
      PGVECTOR_CONNECTION_STRING: postgresql+psycopg://langchain:langchain@pgvector:5432/vectorstore
      LANGFUSE_HOST: http://langfuse-web:3000
      LANGFUSE_BASE_URL: http://langfuse-web:3000
    command: ["python", "-m", "team3_hackathon2.rag.ingest"]
    depends_on:
      pgvector:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    image: team3-hackathon2
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      # record_assessment writes the system-of-record JSON here
      - ./evaluation-results:/app/evaluation-results
    depends_on:
      ingest:
        condition: service_completed_successfully
      langfuse-web:
        condition: service_started

volumes:
  pgdata:
