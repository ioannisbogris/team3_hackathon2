services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: team3-pgvector
    environment:
      POSTGRES_DB: vectorstore
      POSTGRES_USER: langchain
      POSTGRES_PASSWORD: langchain
    ports:
      - "5445:5432"
    volumes:
      - team3_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langchain -d vectorstore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  team3_pgvector_data: