services:
  langgraph-agent:
    build: .
    image: myapp
    container_name: myapp
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside the container "localhost" is the container itself; reach services on the host instead
      - PGVECTOR_CONNECTION_STRING=postgresql+psycopg://langchain:langchain@host.docker.internal:5433/vectorstore
      - LANGFUSE_HOST=http://host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
